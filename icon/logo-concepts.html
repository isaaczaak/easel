<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easel — Logo Design Exploration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #FAFAFA;
            color: #1A1A1A;
            overflow-x: hidden;
        }

        .font-mono {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }

        /* Subtle grain texture */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        /* Smooth scroll */
        html {
            scroll-behavior: smooth;
        }

        /* Logo hover effects */
        .logo-card {
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-card:hover {
            transform: translateY(-4px);
        }

        .logo-canvas {
            position: relative;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Aura effect on hover */
        .logo-aura {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
            border-radius: 50%;
            transform: scale(0.5);
            opacity: 0;
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            filter: blur(40px);
            pointer-events: none;
        }

        .logo-card:hover .logo-aura {
            transform: scale(1);
            opacity: 1;
        }

        /* Divider animation */
        .divider-line {
            width: 0;
            height: 1px;
            background: #1A1A1A;
            opacity: 0.2;
            transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-card:hover .divider-line {
            width: 100%;
        }

        /* Showcase image effects */
        .showcase-img {
            transition: transform 0.5s ease, box-shadow 0.5s ease;
            border-radius: 8px;
            overflow: hidden;
        }

        .showcase-img:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
        }

        /* Typography refinements */
        .tracking-ultra-wide {
            letter-spacing: 0.2em;
        }

        .text-balance {
            text-wrap: balance;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        
        const S = { fill: 'none', stroke: 'currentColor', strokeLinecap: 'round', strokeLinejoin: 'round' };

        // 1. Pure geometric: a solid canvas leaning on a single strut.
        const Lean = () => (
          <svg viewBox="0 0 100 100" className="w-full h-full">
            <line x1="60" y1="18" x2="72" y2="82" {...S} strokeWidth="5" />
            <rect x="24" y="26" width="40" height="44" rx="3" fill="currentColor" transform="rotate(-7 44 48)" />
            <line x1="20" y1="74" x2="70" y2="74" {...S} strokeWidth="4" />
          </svg>
        );

        // 2. Dot matrix: a salon wall of nine works, one slot open for the next.
        const Salon = () => (
          <svg viewBox="0 0 100 100" className="w-full h-full">
            <g fill="currentColor">
              {[[22,22],[40,22],[22,40],[40,40],[58,40],[22,58],[40,58],[58,58]].map(([x,y],i) =>
                <rect key={i} x={x} y={y} width="14" height="14" rx="3.5" />)}
            </g>
            <rect x="59.5" y="23.5" width="11" height="11" rx="2.5" {...S} strokeWidth="3" />
          </svg>
        );

        // 3. Line system: the easel itself, three legs and a ledge.
        const AFrame = () => (
          <svg viewBox="0 0 100 100" className="w-full h-full">
            <line x1="50" y1="16" x2="57" y2="84" {...S} strokeWidth="2.5" opacity="0.45" />
            <path d="M31 84 L50 16 L69 84" {...S} strokeWidth="4" />
            <path d="M24 54 L24 60 L76 60 L76 54" {...S} strokeWidth="4" />
          </svg>
        );

        // 4. Dots + geometry: a framed canvas with a single sun, on two legs.
        const Plein = () => (
          <svg viewBox="0 0 100 100" className="w-full h-full">
            <rect x="26" y="20" width="48" height="40" rx="3" {...S} strokeWidth="3.5" />
            <circle cx="60" cy="34" r="6" fill="currentColor" />
            <path d="M36 60 L30 84 M64 60 L70 84" {...S} strokeWidth="3.5" />
          </svg>
        );

        // 5. Lines + geometry: a canvas inside the arc of a turning cycle.
        const Rotation = () => (
          <svg viewBox="0 0 100 100" className="w-full h-full">
            <rect x="36" y="36" width="28" height="28" rx="3" fill="currentColor" />
            <path d="M50 18 A32 32 0 1 1 22.3 34" {...S} strokeWidth="3.5" />
            <circle cx="22.3" cy="34" r="4" fill="currentColor" />
          </svg>
        );

        // 6. Layered: canvases stacked on a ledge, the front one in full.
        const Stack = () => (
          <svg viewBox="0 0 100 100" className="w-full h-full">
            <rect x="40" y="18" width="34" height="38" rx="3" fill="currentColor" opacity="0.22" />
            <rect x="33" y="24" width="34" height="38" rx="3" fill="currentColor" opacity="0.5" />
            <rect x="26" y="30" width="34" height="38" rx="3" fill="currentColor" />
            <path d="M20 72 L80 72 M34 72 L28 86 M66 72 L72 86" {...S} strokeWidth="3.5" />
          </svg>
        );


        const LogoShowcase = () => {
            const logos = [
                
                { Component: Lean, title: 'Lean', subtitle: 'PURE GEOMETRIC', philosophy: 'A solid canvas propped against one strut. The easel is reduced to the gesture of leaning: two shapes and a ledge, nothing else.' },
                { Component: Salon, title: 'Salon', subtitle: 'DOT MATRIX', philosophy: 'A salon hang of nine works with one slot open: the next painting about to arrive. Speaks to the collection and the rotation at once.' },
                { Component: AFrame, title: 'A-Frame', subtitle: 'LINE SYSTEM', philosophy: 'The easel as three strokes: two front legs meeting at the top, a faint back leg for depth, and a ledge with lips. Unmistakable at any size.' },
                { Component: Plein, title: 'Plein Air', subtitle: 'DOTS + GEOMETRY', philosophy: 'An empty frame on two legs holding a single sun. The simplest possible painting, standing on the simplest possible easel.' },
                { Component: Rotation, title: 'Rotation', subtitle: 'LINES + GEOMETRY', philosophy: 'One canvas at the centre of an almost-closed circle. The arc reads as time passing and the artwork turning over.' },
                { Component: Stack, title: 'Stack', subtitle: 'LAYERED', philosophy: 'Three canvases waiting on a ledge, fading back into the collection. The front one is today\'s wallpaper.' },

            ];

            return (
                <div className="min-h-screen flex flex-col items-center py-20 px-6">

                    {/* Header */}
                    <div className="text-center mb-20 max-w-3xl">
                        <h1 className="text-6xl md:text-7xl font-extralight tracking-wider mb-6">
                            Easel
                        </h1>
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide mb-8">
                            Fine art, rotating on your desktop
                        </p>
                        <div className="w-12 h-[1px] bg-[#1A1A1A] mx-auto opacity-30"></div>
                    </div>

                    {/* Logo Grid */}
                    <div className="max-w-7xl w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16 mb-32">
                        {logos.map((logo, index) => (
                            <div key={index} className="flex flex-col items-center logo-card cursor-pointer">

                                {/* Logo Canvas */}
                                <div className="w-64 h-64 mb-10 flex items-center justify-center relative">
                                    <div className="logo-aura"></div>
                                    <div className="w-32 h-32 relative z-10 logo-canvas">
                                        <logo.Component />
                                    </div>
                                </div>

                                {/* Text Description */}
                                <div className="text-center w-full px-4">
                                    <h2 className="text-xl font-medium tracking-wider mb-2 uppercase">
                                        {logo.title}
                                    </h2>
                                    <h3 className="text-xs font-mono opacity-50 tracking-widest mb-6">
                                        {logo.subtitle}
                                    </h3>
                                    <p className="text-sm leading-relaxed opacity-70 text-left font-light text-balance">
                                        {logo.philosophy}
                                    </p>
                                </div>

                                {/* Bottom Divider */}
                                <div className="divider-line mt-8 mx-auto"></div>
                            </div>
                        ))}
                    </div>

                    {/* Showcase Images Section */}
                    

                    {/* Footer */}
                    <div className="mt-32 max-w-2xl text-center">
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide leading-loose">
                            Generated with Logo Generator<br/>
                            2026
                        </p>
                    </div>

                </div>
            );
        };

        ReactDOM.render(<LogoShowcase />, document.getElementById('root'));
    </script>

</body>
</html>
