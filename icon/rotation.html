<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Easel — Rotation refinements</title>
<style>
  body { margin: 0; padding: 40px 32px; background: #fafafa; color: #1a1a1a;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
  h1 { font-weight: 300; letter-spacing: .04em; margin: 0 0 4px; }
  p.sub { margin: 0 0 32px; opacity: .55; }
  .row { display: grid; grid-template-columns: 170px 120px 120px 120px 60px 1fr; gap: 24px;
         align-items: center; padding: 22px 0; border-top: 1px solid #e6e6e6; }
  .mark { width: 120px; height: 120px; }
  .icon { width: 120px; height: 120px; border-radius: 27px; display: grid; place-items: center; }
  .icon svg { width: 72%; height: 72%; }
  .light { background: #f3f0ea; color: #1a1a1a; box-shadow: inset 0 0 0 1px #e2ddd3; }
  .dark { background: #161616; color: #f3f0ea; }
  .accent { background: #161616; color: #f3f0ea; }
  .accent .art { color: #d9663a; }
  .small { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .small svg { color: #1a1a1a; }
  .label b { display: block; font-size: 15px; letter-spacing: .06em; }
  .label span { opacity: .6; }
</style>
</head>
<body>
<h1>Rotation</h1>
<p class="sub">Large mark · light icon · dark icon · dark icon with accent · 32px and 16px</p>
<div id="rows"></div>

<script>
// Every variant is a function returning SVG markup in a 100×100 box.
// "art" elements take the accent colour where one is used.
const S = 'fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"';
const variants = [
  { name: 'A · Original', note: 'Square canvas, 300° arc, round end.', svg: () => `
      <rect class="art" x="36" y="36" width="28" height="28" rx="3" fill="currentColor"/>
      <path d="M50 18 A32 32 0 1 1 22.3 34" ${S} stroke-width="3.5"/>
      <circle cx="22.3" cy="34" r="4" fill="currentColor"/>` },
  { name: 'B · Landscape', note: 'Canvas in a wallpaper ratio, heavier arc, larger gap so the turn reads at small sizes.', svg: () => `
      <rect class="art" x="32" y="38" width="36" height="24" rx="3" fill="currentColor"/>
      <path d="M58.3 18.9 A32 32 0 1 1 30 25" ${S} stroke-width="4.5"/>
      <circle cx="30" cy="25" r="5" fill="currentColor"/>` },
  { name: 'C · Hung', note: 'Canvas tilted mid-turn, as if the arc is carrying it round.', svg: () => `
      <rect class="art" x="35" y="37" width="30" height="26" rx="3" fill="currentColor" transform="rotate(-12 50 50)"/>
      <path d="M58.3 18.9 A32 32 0 1 1 30 25" ${S} stroke-width="4"/>
      <circle cx="30" cy="25" r="4.5" fill="currentColor"/>` },
  { name: 'D · Painting', note: 'Outlined canvas with a sun inside, so the centre is unmistakably a picture.', svg: () => `
      <rect x="33" y="37" width="34" height="26" rx="3" ${S} stroke-width="3.5"/>
      <circle class="art" cx="57" cy="45" r="4" fill="currentColor"/>
      <path d="M58.3 18.9 A32 32 0 1 1 30 25" ${S} stroke-width="3.5"/>
      <circle cx="30" cy="25" r="4.5" fill="currentColor"/>` },
  { name: 'E · Next', note: 'The arc ends in a small second canvas: the next artwork arriving.', svg: () => `
      <rect class="art" x="33" y="38" width="34" height="24" rx="3" fill="currentColor"/>
      <path d="M58.3 18.9 A32 32 0 1 1 26 27" ${S} stroke-width="4"/>
      <rect x="19" y="18" width="13" height="10" rx="2" fill="currentColor"/>` },
];

const svg = (inner, size) => `<svg viewBox="0 0 100 100" width="${size}" height="${size}">${inner}</svg>`;
document.getElementById('rows').innerHTML = variants.map(v => `
  <div class="row">
    <div class="label"><b>${v.name}</b><span>${v.note}</span></div>
    <div class="icon light">${svg(v.svg(), '100%')}</div>
    <div class="icon dark">${svg(v.svg(), '100%')}</div>
    <div class="icon accent">${svg(v.svg(), '100%')}</div>
    <div class="small">${svg(v.svg(), 32)}${svg(v.svg(), 16)}</div>
    <div></div>
  </div>`).join('');
</script>
</body>
</html>
